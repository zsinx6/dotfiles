################
### MONITORS ###
################
monitor = DP-1, 3440x1440@165, 1920x0, 1
monitor = HDMI-A-2, 1920x1080, 0x0, 1

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$menu = rofi -show drun 
$fileManager = thunar


#################
### AUTOSTART ###
#################
exec-once = $HOME/.config/waybar/launch-waybar.sh & swaync # & swww-daemon
#exec-once = swww img $HOME/wall.png
exec-once = nm-applet
exec-once = hyprpm reload -n
exec-once = hyprpaper
#exec-once = hyprctl setcursor Sweet-cursors-hyprcursor 30
exec-once = hyprctl setcursor Adwaita 1
exec-once = [workspace 5 silent] transmission-gtk

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Breeze Light
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Breeze Light
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

#####################
### LOOK AND FEEL ###
#####################
cursor {
    # 2 = auto: keep hardware cursors, but switch them off while a game is tearing
    no_hardware_cursors = 2
    default_monitor = DP-1
}

general { 
    gaps_in = 0
    gaps_out = 0

    border_size = 0

    # No edge-grab resizing (it flips the cursor to a resize arrow near window
    # edges); resize with Super+RightMouse drag or Super+Ctrl+arrows instead.
    resize_on_border = false

    allow_tearing = true

    layout = dwindle

    snap {
        enabled = true        
    }
}

decoration {
    rounding = 0

    # Change transparency of focused and unfocused windows
    active_opacity = 1
    inactive_opacity = 0.9

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 2 # 12
        passes = 4
        new_optimizations = on
        # xray = true 
        #vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = custom-1, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.05, 0.9, 0.1, 1.1

    animation = windows, 1, 7, custom-1
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, custom-1
}

dwindle {
    preserve_split = true # You probably want this
    # Split direction follows the cursor: drop (or open) a window over the
    # bottom/top triangle of a target to stack vertically, left/right to split
    # side-by-side. Without this, orientation is forced by the pane's aspect
    # ratio, so wide panes (e.g. 2 windows on an ultrawide) can never stack.
    smart_split = true
    # force_split = 2    # overridden by smart_split; re-enable if it's turned off
}

master {
    new_on_active = after
}

misc {
    force_default_wallpaper = 0  # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    # VRR (adaptive sync) for fullscreen windows with game/video content.
    # 0 = off, 1 = always on, 2 = all fullscreen, 3 = fullscreen game/video only
    vrr = 3
}

render {
    # Direct scanout for fullscreen games (lower latency).
    # 0 = off, 1 = always, 2 = only for windows with 'game' content type
    # Set back to 0 if a game shows graphical glitches.
    direct_scanout = 2
}

#############
### INPUT ###
#############
input {
    kb_layout = us
    kb_variant = intl
#    kb_model =
#    kb_options =
#    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    # accel_profile = flat # uncomment for raw, unaccelerated mouse input (affects desktop too)

#    touchpad {
#        natural_scroll = false
#    }
}


####################
### KEYBINDINGSS ###
####################
$mainMod = SUPER

bind = $mainMod,       RETURN, exec,          $terminal
bind = $mainMod SHIFT CONTROL,       Q,      exit,
bind = $mainMod SHIFT, Q,      killactive,
bind = $mainMod,       E,      exec,          $fileManager
bind = $mainMod , M,  togglefloating,
bind = $mainMod,       D,      exec,          $menu
bind = $mainMod,       L,      pseudo,        # dwindle
bind = $mainMod,       J,      layoutmsg,     togglesplit # dwindle
bind = $mainMod ALT,       L,      exec, hyprlock # dwindle

bind = $mainMod, Print, exec, ~/.config/hypr/print.sh
bind = $mainMod SHIFT, Print, exec, grimblast --notify save area ~/Pictures/Screenshots/`date +%Y-%m-%d_%H:%M:%S`.png
bind = $mainMod CONTROL, P, exec, grimblast --notify save screen ~/Pictures/Screenshots/`date +%Y-%m-%d_%H:%M:%S`.png

# move focus with mainMod + arrow keys
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d


plugin {
    split-monitor-workspaces {
        count = 6
        keep_focused = 0
        enable_notifications = 0
        enable_persistent_workspaces = 1
    }
}

# Switch workspaces with mainMod + [0-5]
bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5
bind = $mainMod, 6, split-workspace, 6

# Move active window to a workspace with mainMod + SHIFT + [0-5]
bind = $mainMod SHIFT, 1, split-movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, split-movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, split-movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, split-movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, split-movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, split-movetoworkspacesilent, 6

bind = $mainMod, O, split-changemonitor, next

# l-flagged binds keep working while the screen is locked (hyprlock)
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl = , XF86AudioMicMute, exec, pamixer --default-source -m
bindl = , XF86AudioMute, exec, pamixer -t
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

binde = $mainMod, tab, cyclenext


# switch windows around
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

xwayland {
  force_zero_scaling = true
}
# resize windows
$resizeAmount = 30

binde = $mainMod CONTROL, left,  resizeactive, -$resizeAmount 0
binde = $mainMod CONTROL, right, resizeactive, $resizeAmount 0
binde = $mainMod CONTROL, up,    resizeactive, 0 -$resizeAmount
binde = $mainMod CONTROL, down,  resizeactive, 0 $resizeAmount

# special workspace (scratchpad)
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace,        special:magic

# scroll through existing workspaces with mainMod + scroll (monitor-local via plugin)
bind = $mainMod, mouse_down, split-cycleworkspaces, next
bind = $mainMod, mouse_up, split-cycleworkspaces, prev

bind = $mainMod ALT, left, split-cycleworkspaces, prev
bind = $mainMod ALT, right, split-cycleworkspaces, next

# move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = SUPER, F, fullscreen


##############################
### WINDOWS AND WORKSPACES ###
##############################
#windowrulev2 = suppressevent maximize, class:.*
#windowrulev2 = stayfocused, title:(Rofi)


windowrule = match:title Bruno, float on, center on, size 1600 1200
#windowrule = float yes, title:Robo 3T - (.*)
windowrule = match:title .*- KeePassXC.*, float on, center on, size 900 900

# Games (Steam / gamescope): tag as 'game' content (activates VRR + direct scanout
# above), allow tearing, skip blur, and stay fully opaque even when unfocused.
windowrule = match:class ^(steam_app_\d+|gamescope)$, content game, immediate on, no_blur on, opacity 1.0 override 1.0 override
# XIVLauncher and FFXIV launched through it (Wine windows use the exe name as class)
windowrule = match:class ^(XIVLauncher\.Core|ffxiv_dx11\.exe|ffxiv\.exe)$, content game, immediate on, no_blur on, opacity 1.0 override 1.0 override

